<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calorie Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🍽️ PlateSense  Calorie Tracker</h1>

            <p class="subtitle">
                Track the calories you consume throughout the day.
            </p>

            <div class="total-section">

                <p>Total Calories Consumed</p>

                <h2 id="totalCalories">0</h2>

                <span>calories</span>

            </div>

            <div class="input-section">

                <label for="calorieInput">
                    Enter Calories
                </label>

                <input
                    type="number"
                    id="calorieInput"
                    placeholder="e.g. 500"
                    min="1"
                >

                <button id="addButton">
                    Add Calories
                </button>

            </div>

            <div class="history-section">

                <h3>Today's Entries</h3>

                <ul id="calorieList">
                    <li class="empty-message">
                        No calories added yet.
                    </li>
                </ul>

            </div>

            <div class="button-section">

                <button id="removeButton" class="secondary-button">
                    Remove Last
                </button>

                <button id="resetButton" class="danger-button">
                    Reset Day
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
